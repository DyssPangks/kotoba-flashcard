function kanaToRomaji(kana) {
    let result = "";
    let i = 0;
    while (i < kana.length) {
        let char = kana[i];
        let nextChar = kana[i+1] || "";
        let combined = char + nextChar;
        
        if (romajiMap[combined]) {
            result += romajiMap[combined]; i += 2;
        } else if (romajiMap[char]) {
            result += romajiMap[char]; i++;
        } else if ((char === 'っ' || char === 'ッ') && nextChar) {
            let nextRomaji = romajiMap[nextChar + (kana[i+2] || "")] || romajiMap[nextChar];
            if (nextRomaji) result += nextRomaji[0];
            i++;
        } else if (char === 'ー' || char === '-') {
            if (result.length > 0) result += result[result.length-1];
            i++;
        } else if (char === '・' || char === ' ') {
            result += ' '; i++;
        } else if (char === '〜' || char === '~') {
            result += '~'; i++;
        } else if (char === '[' || char === ']' || char === '（' || char === '）' || char === '(' || char === ')') {
            result += char; i++;
        } else {
            result += char; i++;
        }
    }
    return result;
}

let currentBab = 1;
let reverseMode = false;

function toggleMode() {
    reverseMode = !reverseMode;
    renderCards();
}

function renderCards() {
    const container = document.getElementById('flashcard-grid');
    container.innerHTML = '';

    const currentData = babData[currentBab - 1];

    currentData.forEach(item => {
        const kana = item[0];
        const arti = item[1];
        const romaji = kanaToRomaji(kana);

        let frontHTML, backHTML;

        if (reverseMode) {
            // Depan: arti Indonesia | Belakang: hiragana saja (tanpa cara baca)
            frontHTML = `<span class="text-xs sm:text-sm text-slate-800 font-bold leading-snug px-1">${arti}</span>`;
            backHTML = `<span class="kana-font text-lg sm:text-2xl font-bold text-slate-800 leading-snug px-1">${kana}</span>`;
        } else {
            // Depan: hiragana | Belakang: cara baca + arti
            frontHTML = `<span class="kana-font text-lg sm:text-2xl font-bold text-slate-800 leading-snug px-1">${kana}</span>`;
            backHTML = `
                <span class="text-xs sm:text-sm italic text-teal-600 mb-1 font-medium">[${romaji}]</span>
                <span class="text-xs sm:text-sm text-slate-800 font-bold leading-snug px-1">${arti}</span>`;
        }

        const cardHTML = `
        <div class="card group perspective-1000 cursor-pointer w-full aspect-[5/4] sm:h-36" onclick="this.classList.toggle('flipped')">
            <div class="card-inner relative w-full h-full transform-style-3d">
                
                <!-- Sisi Depan -->
                <div class="absolute inset-0 backface-hidden bg-white border border-slate-200 rounded-2xl shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex flex-col items-center justify-center p-3 text-center">
                    ${frontHTML}
                </div>
                
                <!-- Sisi Belakang -->
                <div class="absolute inset-0 backface-hidden rotate-y-180 bg-[#f0fdf4] border-2 border-[#6ee7b7] rounded-2xl shadow-sm flex flex-col items-center justify-center p-3 text-center">
                    ${backHTML}
                </div>
                
            </div>
        </div>
        `;
        container.insertAdjacentHTML('beforeend', cardHTML);
    });

    document.getElementById('bab-title').textContent = `Pelajaran ${currentBab}`;
    document.getElementById('curr-page').textContent = currentBab;
    document.getElementById('tot-page').textContent = babData.length;
    document.getElementById('tot-words').textContent = `(${currentData.length} Kosakata)`;
    document.getElementById('mode-label').textContent = reverseMode ? 'Mode: Indo → Hiragana' : 'Mode: Hiragana → Indo';
    
    document.getElementById('btn-prev').disabled = currentBab === 1;
    document.getElementById('btn-next').disabled = currentBab === babData.length;
}

function changeBab(direction) {
    const newBab = currentBab + direction;
    if (newBab >= 1 && newBab <= babData.length) {
        currentBab = newBab;
        renderCards();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

function shuffleArray(array) {
    let currentIndex = array.length, randomIndex;
    while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
    }
    return array;
}

function resetCards() {
    shuffleArray(babData[currentBab - 1]);
    renderCards();
}

function prepareAndPrint() {
    const printContainer = document.getElementById('print-container');
    printContainer.innerHTML = '';
    
    const currentData = babData[currentBab - 1];
    const headerHTML = `<h2 style="text-align:center; font-size: 22px; font-family: sans-serif; margin-bottom: 24px; color: #0f172a;">Daftar Kosakata Pelajaran ${currentBab} (${currentData.length} Kosakata)</h2>`;
    
    const grid = document.createElement('div');
    grid.style.display = 'grid';
    grid.style.gridTemplateColumns = 'repeat(4, 1fr)';
    grid.style.gap = '12px';
    
    currentData.forEach((item, index) => {
        const kana = item[0];
        const arti = item[1];
        const romaji = kanaToRomaji(kana);
        
        const cardHTML = `
            <div style="border: 2px solid #e2e8f0; padding: 12px; text-align: center; border-radius: 12px; page-break-inside: avoid; font-family: sans-serif;">
                <div style="font-size: 11px; color: #94a3b8; text-align: left; margin-bottom: 4px;">#${index + 1}</div>
                <div style="font-size: 18px; font-weight: bold; margin-bottom: 6px; font-family: 'Noto Sans JP', sans-serif; color: #1e293b;">${kana}</div>
                <div style="font-size: 11px; color: #0d9488; margin-bottom: 4px; font-style: italic;">[${romaji}]</div>
                <div style="font-size: 12px; font-weight: bold; color: #0f172a;">${arti}</div>
            </div>
        `;
        grid.insertAdjacentHTML('beforeend', cardHTML);
    });
    
    printContainer.insertAdjacentHTML('afterbegin', headerHTML);
    printContainer.appendChild(grid);
    
    setTimeout(() => {
        window.print();
    }, 400);
}

function showToast(message) {
    const toast = document.getElementById('toast');
    document.getElementById('toast-message').textContent = message;
    toast.classList.remove('opacity-0');
    setTimeout(() => {
        toast.classList.add('opacity-0');
    }, 3000);
}

function shareApp() {
    if (navigator.share) {
        navigator.share({
            title: `Flashcard Kotoba - Pelajaran ${currentBab}`,
            text: `Latihan Flashcard Kotoba Pelajaran ${currentBab} Minna no Nihongo.`,
            url: window.location.href
        }).catch(err => console.log(err));
    } else {
        try {
            const tempInput = document.createElement('input');
            tempInput.value = window.location.href;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("Link berhasil disalin!");
        } catch (err) {
            showToast("Browser tidak mendukung fitur ini.");
        }
    }
}

// ================= PENCARIAN =================
const $ = id => document.getElementById(id);
let searchIndex = [];
const MAX_RESULTS = 200;

function escHTML(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Katakana -> hiragana + huruf kecil. Panjang teks tetap sama supaya posisi sorotan akurat.
function foldText(str) {
    return String(str)
        .replace(/[\u30A1-\u30F6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
        .toLowerCase();
}

function romajiKey(str) {
    return String(str).toLowerCase().replace(/[^a-z]/g, '');
}

// Indeks dibuat sekali di awal (urutan asli bab), jadi tidak terpengaruh tombol "Acak Bab Ini"
function buildSearchIndex() {
    searchIndex = [];
    babData.forEach((bab, i) => {
        bab.forEach(item => {
            const romaji = kanaToRomaji(item[0]);
            searchIndex.push({
                bab: i + 1, kana: item[0], arti: item[1], romaji: romaji,
                kanaF: foldText(item[0]), kanaCore: foldText(item[0]).replace(/[~～〜\s]/g, ''),
                artiF: foldText(item[1]), romKey: romajiKey(romaji)
            });
        });
    });
}

// Skor kecocokan satu kata kunci terhadap satu entri (0 = tidak cocok)
function scoreToken(e, t) {
    let best = 0;
    // hiragana / katakana
    if (e.kanaF.includes(t)) best = Math.max(best, e.kanaCore === t ? 100 : e.kanaCore.startsWith(t) ? 60 : 20);
    // romaji (hanya untuk kata kunci huruf latin murni)
    const tr = /^[a-z]+$/.test(t) ? t : '';
    if (tr && e.romKey.includes(tr)) best = Math.max(best, e.romKey === tr ? 90 : e.romKey.startsWith(tr) ? 50 : 15);
    // arti
    if (e.artiF.includes(t)) best = Math.max(best, e.artiF === t ? 80 : e.artiF.startsWith(t) ? 45 : 10);
    return best;
}

function getTokens(query) {
    return foldText(query)
        .split(/\s+/)
        .map(t => t.replace(/[~～〜]/g, ''))   // tanda ~ tidak ikut dicari
        .filter(Boolean);
}

function searchEntries(tokens) {
    const found = [];
    searchIndex.forEach((e, idx) => {
        let total = 0;
        const ok = tokens.every(t => { const sc = scoreToken(e, t); total += sc; return sc > 0; });
        if (ok) found.push({ e: e, total: total, idx: idx });
    });
    found.sort((a, b) => b.total - a.total || a.idx - b.idx);   // skor tinggi dulu, lalu urutan buku
    return found.map(f => f.e);
}

function highlightText(raw, folded, tokens) {
    if (raw.length !== folded.length) return escHTML(raw);
    const mark = new Array(raw.length).fill(false);
    tokens.forEach(t => {
        let i = folded.indexOf(t);
        while (i !== -1) {
            for (let k = i; k < i + t.length; k++) mark[k] = true;
            i = folded.indexOf(t, i + t.length);
        }
    });
    let out = '', open = false;
    for (let i = 0; i < raw.length; i++) {
        if (mark[i] && !open) { out += '<mark class="bg-amber-200 text-slate-900 rounded px-0.5">'; open = true; }
        if (!mark[i] && open) { out += '</mark>'; open = false; }
        out += escHTML(raw[i]);
    }
    if (open) out += '</mark>';
    return out;
}

function runSearch() {
    const q = $('search-input').value.trim();
    const active = q.length > 0;

    $('search-clear').classList.toggle('hidden', !active);
    $('search-clear').classList.toggle('flex', active);
    ['nav-box', 'mode-box', 'flashcard-grid'].forEach(id => $(id).classList.toggle('hidden', active));
    $('search-results').classList.toggle('hidden', !active);

    if (!active) { $('search-info').textContent = ''; $('search-results').innerHTML = ''; return; }

    const tokens = getTokens(q);
    if (tokens.length === 0) {
        $('search-info').textContent = 'Ketik hiragana, romaji, atau arti kosakata.';
        $('search-results').innerHTML = '';
        return;
    }

    const results = searchEntries(tokens);
    const shown = results.slice(0, MAX_RESULTS);

    $('search-info').textContent = results.length === 0
        ? ''
        : (results.length > MAX_RESULTS
            ? `${results.length} hasil, menampilkan ${MAX_RESULTS} teratas. Persempit kata kuncinya.`
            : `${results.length} hasil dari semua pelajaran`);

    if (results.length === 0) {
        $('search-results').innerHTML = `<div class="text-center text-sm text-slate-400 bg-white border border-slate-100 rounded-xl p-6">Tidak ada kosakata yang cocok dengan <b class="text-slate-600">${escHTML(q)}</b>.</div>`;
        return;
    }

    $('search-results').innerHTML = shown.map(e => `
        <div class="bg-white border border-slate-200 rounded-xl p-3 flex items-start gap-3">
            <div class="flex-1 min-w-0">
                <div class="kana-font text-lg font-bold text-slate-800 leading-snug break-words">${highlightText(e.kana, e.kanaF, tokens)}</div>
                <div class="text-xs italic text-teal-600 mb-1">[${escHTML(e.romaji)}]</div>
                <div class="text-sm text-slate-700 leading-snug break-words">${highlightText(e.arti, e.artiF, tokens)}</div>
            </div>
            <button onclick="openBab(${e.bab})" class="shrink-0 text-[11px] font-semibold text-teal-700 bg-teal-50 border border-teal-100 rounded-lg px-2 py-1 hover:bg-teal-100">Pelajaran ${e.bab}</button>
        </div>`).join('');
}

function clearSearch() {
    $('search-input').value = '';
    runSearch();
    $('search-input').focus();
}

// Buka pelajaran dari hasil pencarian
function openBab(n) {
    $('search-input').value = '';
    runSearch();
    currentBab = n;
    renderCards();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setupSearch() {
    const input = $('search-input');
    input.addEventListener('input', runSearch);
    input.addEventListener('keydown', e => {
        if (e.key === 'Escape') { input.value = ''; runSearch(); }
        if (e.key === 'Enter') input.blur();   // tutup keyboard di HP
    });
}

buildSearchIndex();
setupSearch();
renderCards();
</script>
